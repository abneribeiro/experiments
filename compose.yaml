# PostgreSQL for the experiments.
#
# There is no volume on purpose: `make db-down` deletes all data, and every
# experiment creates and seeds its own tables. Each run starts from a clean
# database, so results do not depend on leftovers from a previous experiment.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres # user and database default to "postgres"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
